# Gateway do Truco Online (Nginx). É a única porta de entrada do sistema: o navegador só fala
# com ele. Entrega os arquivos de frontend/, repassa cada /api/... ao serviço certo e o /ws/
# (WebSocket da mesa) ao Game.
#
# O docker-compose.yml monta este arquivo em /etc/nginx/conf.d/default.conf. O nginx.conf da
# própria imagem inclui esse arquivo dentro do bloco "http", então aqui só entram "upstream",
# "map" e "server". Depois de mudar este arquivo: docker compose restart gateway

# DNS interno do Docker: é ele que transforma o nome de um serviço ("auth") no endereço do
# container. valid=10s faz o Nginx perguntar de novo a cada 10 segundos, e o "resolve" de cada
# upstream abaixo usa essa resposta. Assim, quando um serviço é recriado e muda de endereço
# (num "docker compose up --build", por exemplo), o gateway acompanha sem precisar reiniciar.
resolver 127.0.0.11 valid=10s ipv6=off;

# Um upstream por serviço: nome e porta do serviço no docker-compose.yml.
upstream auth {
    zone auth 64k;
    server auth:8000 resolve;
}

upstream game {
    zone game 64k;
    server game:8000 resolve;
}

upstream lobby {
    zone lobby 64k;
    server lobby:8000 resolve;
}

upstream ranking {
    zone ranking 64k;
    server ranking:8000 resolve;
}

# Serviço novo que a tela chame: um upstream para ele, no mesmo formato. O de Bots não tem:
# ninguém de fora fala com ele (os bots é que conectam ao Game, por dentro).

# Cabeçalho Connection para o WebSocket. Quando o navegador pede a troca de protocolo
# (Upgrade: websocket), repassa "upgrade"; numa requisição comum, "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Log de acesso do /ws/ sem a query string. O token vai na URL do WebSocket (?token=<jwt>, o
# navegador não deixa pôr cabeçalhos numa conexão WebSocket), e com o "$request" do formato
# padrão ele ficaria gravado no "docker compose logs gateway". Este formato é o "main" da
# imagem (/etc/nginx/nginx.conf) com "$request" trocado por método, caminho e protocolo: o
# resto da linha continua igual ao das outras rotas.
log_format sem_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    # ---------- Frontend ----------
    # Os arquivos de frontend/ (montados só para leitura). "/" abre o index.html (login).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # O navegador pode guardar os arquivos, mas confere com o gateway antes de usar cada um.
        # Assim, uma mudança no frontend vale no próximo F5.
        add_header Cache-Control "no-cache";
    }

    # ---------- APIs ----------
    # O caminho chega INTEIRO ao serviço: /api/auth/login chega ao Auth como /api/auth/login, e
    # as rotas do FastAPI são declaradas com o prefixo completo (APIRouter(prefix="/api/auth")).
    # Por isso "proxy_pass http://auth;" não tem barra nem caminho no fim: com uma barra, o
    # Nginx tiraria o /api/auth/ do começo (docs/guia-backend-login.md, seção 3.1).
    location /api/auth/ {
        proxy_pass http://auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lobby, no mesmo formato do /api/auth/. A rota interna do Game que o Lobby chama
    # (POST /interno/partidas) não passa por aqui: o Lobby a alcança direto, pela rede-servicos.
    location /api/lobby/ {
        proxy_pass http://lobby;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sem barra no fim: a tela pede /api/ranking, sem barra (docs/guia-backend-lobby.md, 3.1).
    # O mesmo bloco atende /api/ranking/jogadores/{id} e a página /api/ranking/docs.
    location /api/ranking {
        proxy_pass http://ranking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket da mesa (Game) ----------
    # /ws/partidas/{partida_id}?token=<jwt> (docs/guia-backend-mesa.md, seção 3.5). Como nas
    # APIs, o caminho chega inteiro ao Game, com a query string. Sem o HTTP 1.1 e os cabeçalhos
    # Upgrade e Connection, a troca de protocolo não chega ao Game e a conexão falha.
    # O token vai na URL, por isso o log de acesso desta rota usa o formato sem_query (acima):
    # grava o caminho, sem o token. O log de erros do Nginx não tem formato configurável e,
    # quando o Game está fora do ar, a linha do erro traz o pedido inteiro, com o token.
    location /ws/ {
        access_log /var/log/nginx/access.log sem_query;
        proxy_pass http://game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O Nginx fecha a conexão depois de 60 s sem dados do Game. O Uvicorn manda um ping a
        # cada 20 s, o que já basta; aumentar este limite é só uma folga.
        proxy_read_timeout 120s;
    }

    # As rotas internas entre serviços (como o POST /interno/partidas do Game) e o /saude de
    # cada serviço NÃO entram aqui: só os containers da rede-servicos as alcançam. Um pedido a
    # /interno/... pelo gateway cai no "location /" acima e recebe 404.
}
