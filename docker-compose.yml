# Truco Online: todos os containers do sistema. Sobe tudo com:
#   docker compose up --build
# As variáveis ${...} vêm do arquivo .env da raiz (crie a partir do .env.example).
#
# ---------------------------------------------------------------------------------------------
# Organização: microserviços, um banco por serviço, redes separadas
# ---------------------------------------------------------------------------------------------
# - O navegador só fala com o gateway (Nginx). Ele é o ÚNICO container com "ports:", isto é,
#   o único que o computador (host) enxerga. Os serviços e os bancos não publicam porta nenhuma.
# - Cada serviço é independente: tem o seu diretório em services/<nome>/, o seu Dockerfile e o
#   seu código. Um serviço nunca importa código de outro.
# - Cada serviço que guarda dados tem o SEU banco, num container próprio, com volume e
#   credenciais próprios. Nenhum serviço conecta no banco de outro.
#
# As redes garantem essas regras (um container só alcança quem está numa rede em comum):
#
#   rede-servicos    gateway + todos os serviços. É por ela que o gateway repassa as requisições
#                    e que os serviços conversam entre si por HTTP e WebSocket.
#   rede-auth-db     auth + auth-db, e mais ninguém. Marcada como "internal": não tem saída para
#                    fora do Docker. O gateway nem consegue achar o nome "auth-db".
#   rede-game-redis  game + game-redis, e mais ninguém (internal), no mesmo padrão.
#   rede-lobby-db    lobby + lobby-db (internal), no mesmo padrão.
#   rede-ranking-db  ranking + ranking-db (internal), no mesmo padrão.
#   rede-eventos     game, lobby, ranking, bots + eventos (internal). O gateway e o auth não
#                    entram.
#
#        navegador
#            |  porta ${GATEWAY_PORTA} (padrão 80)
#        [gateway] ----- rede-servicos ----- [auth] ------ rede-auth-db ------ [auth-db]
#                              |
#                              +------------ [lobby] ----- rede-lobby-db ----- [lobby-db]
#                              |                |
#                              +------------ [ranking] --- rede-ranking-db --- [ranking-db]
#                              |                |
#                              +------------ [game] ------ rede-game-redis --- [game-redis]
#                              |                |
#                              +------------ [bots]         (sem banco)
#                                               |
#               lobby, ranking, game e bots --- rede-eventos ----------------- [eventos]
#
# O lobby chama o game pela rede-servicos (POST /interno/partidas, fora do gateway). O ranking
# não é chamado por ninguém além do gateway: só lê o evento partida.finalizada do broker. O bots
# não é chamado por ninguém: lê o bot.solicitado do broker e conecta ao WebSocket do game pela
# rede-servicos (ws://game:8000), como um jogador.
#
# game-redis e eventos: dois Redis com papéis diferentes
# - game-redis é o BANCO do Game, como o auth-db é o do Auth: guarda o estado das partidas (e a
#   fila de eventos ainda não entregues). É dado do Game, e nenhum outro serviço o acessa.
# - eventos é o BROKER, o meio de comunicação entre os serviços: o Game publica nele os eventos
#   partida.criada e partida.finalizada (Redis Streams, um stream por evento), e os outros
#   serviços os leem (lobby e ranking; o lobby também publica bot.solicitado, que o bots lê).
#   Não guarda dado de ninguém: só as mensagens em trânsito (e, no grupo de consumo do bots,
#   quais pedidos de bot ainda estão em jogo).
#   Separados, um serviço que lê eventos nunca enxerga as partidas, e o Game continua jogando
#   mesmo com o broker fora do ar (os eventos esperam na fila do game-redis).
#
# Para cada serviço novo, repita o padrão:
# - o serviço entra na rede-servicos (para receber as requisições do gateway);
# - se ele tiver banco, crie um container <servico>-db, uma rede rede-<servico>-db (internal)
#   só com os dois, um volume <servico>-db-dados e variáveis <SERVICO>_DB_* no .env, como o
#   lobby + lobby-db e o ranking + ranking-db abaixo;
# - se ele publica ou lê eventos, entra também na rede-eventos e recebe EVENTOS_* como o game.
# O bots segue o padrão sem banco: só rede-servicos e rede-eventos.
# ---------------------------------------------------------------------------------------------

# Nome fixo do projeto: os containers, as redes e os volumes ganham o prefixo "truco-online",
# qualquer que seja o nome da pasta do repositório.
name: truco-online

services:
  # Gateway: entrega os arquivos do frontend, repassa /api/... a cada serviço e /ws/ ao Game
  # (gateway/nginx.conf).
  gateway:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORTA:-80}:80"
    volumes:
      # Arquivos montados só para leitura: mudanças no frontend aparecem sem reconstruir nada.
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - rede-servicos
    depends_on:
      auth:
        condition: service_healthy
      lobby:
        condition: service_healthy
      ranking:
        condition: service_healthy
      game:
        condition: service_healthy

  # Serviço Auth: cadastro, login e emissão do JWT (docs/guia-backend-login.md).
  auth:
    build: ./services/auth
    restart: unless-stopped
    environment:
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env (copie o .env.example)}
      # Dentro do container, o serviço lê sempre BANCO_*; o docker-compose diz qual é o banco.
      BANCO_HOST: auth-db
      BANCO_PORTA: "5432"
      BANCO_NOME: ${AUTH_DB_NOME:?defina AUTH_DB_NOME no .env (copie o .env.example)}
      BANCO_USUARIO: ${AUTH_DB_USUARIO:?defina AUTH_DB_USUARIO no .env (copie o .env.example)}
      BANCO_SENHA: ${AUTH_DB_SENHA:?defina AUTH_DB_SENHA no .env (copie o .env.example)}
    networks:
      - rede-servicos
      - rede-auth-db
    depends_on:
      auth-db:
        condition: service_healthy
    # GET /saude responde 200 quando o serviço está no ar e alcança o banco. A rota não passa
    # pelo gateway: é chamada aqui de dentro do próprio container.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Banco do Auth. Só o serviço auth chega até ele (rede-auth-db).
  auth-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NOME:?defina AUTH_DB_NOME no .env (copie o .env.example)}
      POSTGRES_USER: ${AUTH_DB_USUARIO:?defina AUTH_DB_USUARIO no .env (copie o .env.example)}
      POSTGRES_PASSWORD: ${AUTH_DB_SENHA:?defina AUTH_DB_SENHA no .env (copie o .env.example)}
    volumes:
      - auth-db-dados:/var/lib/postgresql/data
    networks:
      - rede-auth-db
    # Pronto quando aceita conexões pela rede (-h 127.0.0.1). Sem o -h, o teste usaria o socket
    # local e daria "pronto" ainda durante a inicialização do banco, antes de ele ouvir a rede.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Serviço Lobby: salas, assentos, bots, presença e início da partida (docs/guia-backend-lobby.md).
  # Recebe do gateway o /api/lobby/, chama o Game (POST /interno/partidas) pela rede-servicos, lê
  # partida.finalizada e publica bot.solicitado no broker (rede-eventos).
  lobby:
    build: ./services/lobby
    restart: unless-stopped
    environment:
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env (copie o .env.example)}
      # Como no Auth, dentro do container o serviço lê sempre BANCO_*.
      BANCO_HOST: lobby-db
      BANCO_PORTA: "5432"
      BANCO_NOME: ${LOBBY_DB_NOME:?defina LOBBY_DB_NOME no .env (copie o .env.example)}
      BANCO_USUARIO: ${LOBBY_DB_USUARIO:?defina LOBBY_DB_USUARIO no .env (copie o .env.example)}
      BANCO_SENHA: ${LOBBY_DB_SENHA:?defina LOBBY_DB_SENHA no .env (copie o .env.example)}
      # Endereço interno do Game. Não é segredo, por isso fica aqui e não no .env.
      GAME_URL: http://game:8000
      EVENTOS_HOST: eventos
      EVENTOS_PORTA: "6379"
      EVENTOS_SENHA: ${EVENTOS_SENHA:?defina EVENTOS_SENHA no .env (copie o .env.example)}
    networks:
      - rede-servicos
      - rede-lobby-db
      - rede-eventos
    # O Game não está aqui: sem ele o Lobby sobe e funciona, e só o "iniciar" responde 503.
    depends_on:
      lobby-db:
        condition: service_healthy
      eventos:
        condition: service_healthy
    # GET /saude responde 200 quando o serviço está no ar e alcança o banco.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Banco do Lobby. Só o serviço lobby chega até ele (rede-lobby-db).
  lobby-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LOBBY_DB_NOME:?defina LOBBY_DB_NOME no .env (copie o .env.example)}
      POSTGRES_USER: ${LOBBY_DB_USUARIO:?defina LOBBY_DB_USUARIO no .env (copie o .env.example)}
      POSTGRES_PASSWORD: ${LOBBY_DB_SENHA:?defina LOBBY_DB_SENHA no .env (copie o .env.example)}
    volumes:
      - lobby-db-dados:/var/lib/postgresql/data
    networks:
      - rede-lobby-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Serviço Ranking: vitórias e partidas de cada jogador, a partir do evento partida.finalizada
  # (docs/guia-backend-lobby.md). Recebe do gateway o /api/ranking; ninguém mais o chama.
  ranking:
    build: ./services/ranking
    restart: unless-stopped
    environment:
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env (copie o .env.example)}
      BANCO_HOST: ranking-db
      BANCO_PORTA: "5432"
      BANCO_NOME: ${RANKING_DB_NOME:?defina RANKING_DB_NOME no .env (copie o .env.example)}
      BANCO_USUARIO: ${RANKING_DB_USUARIO:?defina RANKING_DB_USUARIO no .env (copie o .env.example)}
      BANCO_SENHA: ${RANKING_DB_SENHA:?defina RANKING_DB_SENHA no .env (copie o .env.example)}
      EVENTOS_HOST: eventos
      EVENTOS_PORTA: "6379"
      EVENTOS_SENHA: ${EVENTOS_SENHA:?defina EVENTOS_SENHA no .env (copie o .env.example)}
    networks:
      - rede-servicos
      - rede-ranking-db
      - rede-eventos
    depends_on:
      ranking-db:
        condition: service_healthy
      eventos:
        condition: service_healthy
    # GET /saude responde 200 quando o serviço está no ar e alcança o banco.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Banco do Ranking. Só o serviço ranking chega até ele (rede-ranking-db).
  ranking-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RANKING_DB_NOME:?defina RANKING_DB_NOME no .env (copie o .env.example)}
      POSTGRES_USER: ${RANKING_DB_USUARIO:?defina RANKING_DB_USUARIO no .env (copie o .env.example)}
      POSTGRES_PASSWORD: ${RANKING_DB_SENHA:?defina RANKING_DB_SENHA no .env (copie o .env.example)}
    volumes:
      - ranking-db-dados:/var/lib/postgresql/data
    networks:
      - rede-ranking-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Serviço Game: regras do truco, estado das partidas, WebSocket da mesa e eventos
  # (docs/guia-backend-mesa.md). Roda num processo só (explicação em app/partidas.py).
  # Recebe do gateway o /ws/ e, dos outros serviços, o POST /interno/partidas (rede-servicos).
  game:
    build: ./services/game
    restart: unless-stopped
    environment:
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env (copie o .env.example)}
      # O banco do Game é o game-redis. Como no Auth, o serviço lê sempre BANCO_*.
      BANCO_HOST: game-redis
      BANCO_PORTA: "6379"
      BANCO_SENHA: ${GAME_REDIS_SENHA:?defina GAME_REDIS_SENHA no .env (copie o .env.example)}
      # O broker de eventos (Redis Streams), compartilhado com os serviços que leem os eventos.
      EVENTOS_HOST: eventos
      EVENTOS_PORTA: "6379"
      EVENTOS_SENHA: ${EVENTOS_SENHA:?defina EVENTOS_SENHA no .env (copie o .env.example)}
    networks:
      - rede-servicos
      - rede-game-redis
      - rede-eventos
    depends_on:
      game-redis:
        condition: service_healthy
      eventos:
        condition: service_healthy
    # GET /saude responde 200 quando o serviço está no ar e alcança o game-redis.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Serviço de Bots: joga pelos assentos de bot (docs/guia-backend-mesa.md, seção 10.7). Lê o
  # bot.solicitado do broker (rede-eventos) e conecta ao WebSocket do Game como um jogador
  # comum, pela rede-servicos (ws://game:8000), sem passar pelo gateway. Não tem banco: os bots
  # ativos ficam guardados no próprio broker, como pedidos ainda não confirmados (app/eventos.py).
  bots:
    build: ./services/bots
    restart: unless-stopped
    environment:
      # O mesmo segredo dos outros serviços: o serviço assina o token de cada bot, e o Game confere.
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO no .env (copie o .env.example)}
      # Endereço interno do Game. Não é segredo, por isso fica aqui e não no .env.
      GAME_WS_URL: ws://game:8000
      EVENTOS_HOST: eventos
      EVENTOS_PORTA: "6379"
      EVENTOS_SENHA: ${EVENTOS_SENHA:?defina EVENTOS_SENHA no .env (copie o .env.example)}
      # Opcional: com um valor, cada bot repete as mesmas escolhas nas mesmas situações.
      BOTS_SEMENTE: ${BOTS_SEMENTE:-}
    networks:
      - rede-servicos
      - rede-eventos
    # O Game não está aqui: sem ele o serviço sobe, e os bots esperam e reconectam sozinhos.
    depends_on:
      eventos:
        condition: service_healthy
    # GET /saude responde 200 quando o serviço está no ar e alcança o broker.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Banco do Game: estado das partidas. Só o serviço game chega até ele (rede-game-redis).
  # --appendonly yes grava cada mudança em disco (no volume): as partidas sobrevivem a um
  # reinício do container. A senha vem do .env; o REDISCLI_AUTH deixa o redis-cli do próprio
  # container (healthcheck e "docker compose exec game-redis redis-cli") entrar sem digitá-la.
  game-redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${GAME_REDIS_SENHA:?defina GAME_REDIS_SENHA no .env (copie o .env.example)}"]
    environment:
      REDISCLI_AUTH: ${GAME_REDIS_SENHA:?defina GAME_REDIS_SENHA no .env (copie o .env.example)}
    volumes:
      - game-redis-dados:/data
    networks:
      - rede-game-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Broker de eventos: Redis dedicado à comunicação entre os serviços, com Redis Streams.
  # O game publica partida.criada e partida.finalizada; o lobby lê partida.finalizada e publica
  # bot.solicitado; o ranking lê partida.finalizada; o bots lê bot.solicitado.
  # Também grava em disco: um evento publicado espera no stream até o consumidor ler.
  eventos:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${EVENTOS_SENHA:?defina EVENTOS_SENHA no .env (copie o .env.example)}"]
    environment:
      REDISCLI_AUTH: ${EVENTOS_SENHA:?defina EVENTOS_SENHA no .env (copie o .env.example)}
    volumes:
      - eventos-dados:/data
    networks:
      - rede-eventos
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

networks:
  rede-servicos: {}
  rede-auth-db:
    internal: true
  rede-lobby-db:
    internal: true
  rede-ranking-db:
    internal: true
  rede-game-redis:
    internal: true
  rede-eventos:
    internal: true

volumes:
  # Dados de cada banco. Sobrevivem a "docker compose down"; só "down -v" apaga.
  auth-db-dados:
  lobby-db-dados:
  ranking-db-dados:
  game-redis-dados:
  eventos-dados:
